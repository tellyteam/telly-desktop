[package]
name = "telly"
version = "1.0.0"
description = "A small, fast IPTV player"
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "telly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The login and the data key live in the macOS Keychain.
keyring = { version = "3", features = ["apple-native"] }
aes-gcm = "0.10"
base64 = "0.22"
# The local stream relay: a tiny HTTP server on 127.0.0.1 and a blocking client per request thread.
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
