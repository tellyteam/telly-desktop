name: Release

# Push a version tag (e.g. v1.0.1) to build the LG TV package (.ipk). It goes to a draft release:
# write the notes by hand, then publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the tag as the version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      - name: Draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build-webos/*.ipk --draft --title "telly for LG ${GITHUB_REF_NAME#v}" --notes ""
